name: Temporary Vault Prettier Preview

on:
  push:
    branches: [ui/vault-compact-view-20261101]
    paths:
      - ".github/workflows/vault-format-preview.yml"

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-web
      - name: Format only the new Vault row, without committing
        run: pnpm --dir apps/web exec prettier --write components/vault/VaultAccountRow.tsx
      - name: Print formatting diff
        run: git diff -- apps/web/components/vault/VaultAccountRow.tsx
